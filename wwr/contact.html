<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Get in touch with Honduras Rafting — find our address, phone, email, and connect with our team. Plan your next adventure today!">
  <meta name="author" content="Jorge Centeno">
  <title>Contact Us | Honduras Rafting</title>
  <link rel="stylesheet" href="styles/rafting.css">
</head>
<body>

  <header>
    <img src="images/raftinglogo.png" alt="Honduras Rafting logo" width="200">
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="trips.html">Trips</a></li>
        <li><a href="contact.html">Contact Us</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Contact Us</h1>

    <section>
      <h2>Our Office</h2>
      <p>Address: Colonia Palmira, Tegucigalpa, Honduras</p>
      <p>Phone: +504 2222-3333</p>
      <p>Email: info@hondurasrafting.com</p>
      <iframe src="https://www.google.com/maps/embed?..."></iframe>
    </section>

    <section>
      <h2>Meet Our Team</h2>
      <figure>
        <img src="images/maria.jpg" alt="Rafting Guide">
        <figcaption>Maria Lopez — Lead Guide</figcaption>
      </figure>
      <figure>
        <img src="images/carlos.jpg" alt="Safety Coordinator">
        <figcaption>Carlos Ramirez — Safety Coordinator</figcaption>
      </figure>
      <figure>
        <img src="images/ana.jpg" alt="Customer Service">
        <figcaption>Ana Torres — Customer Service</figcaption>
      </figure>
    </section>

    <section>
      <h2>Send Us a Message</h2>
      <form action="#" method="post">
        <label for="name">Your Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Your Email:</label>
        <input type="email" id="email" name="email" required>

        <p>Purpose of Message:</p>
        <label><input type="radio" name="purpose" value="General Inquiry"> General Inquiry</label><br>
        <label><input type="radio" name="purpose" value="Reservation Question"> Reservation Question</label><br>
        <label><input type="radio" name="purpose" value="Website Suggestion"> Website Suggestion</label><br>

        <label for="message">Message:</label>
        <textarea id="message" name="message" rows="5" required></textarea>

        <label>
          <input type="checkbox" name="subscribe"> Please subscribe me to the monthly newsletter
        </label><br>

        <button type="submit">Send Message</button>
      </form>
    </section>
  </main>

  <footer>
    <p>Copyright © 2026 Honduras Rafting | Jorge Centeno</p>
    <nav class="socialmedia">
      <a href="https://facebook.com"><img src="images/facebookicon.png" alt="Facebook Icon" width="40"></a>
      <a href="https://instagram.com"><img src="images/instagramicon.png" alt="Instagram Icon" width="40"></a>
      <a href="https://youtube.com"><img src="images/youtubeicon.png" alt="Youtube Icon" width="40"></a>
    </nav>
  </footer>
</body>
</html>
